[package]
name = "fuzzy_crypto_core"
version = "0.1.0"
edition = "2021"

[lib]
# `rlib` only so `examples/bench_file.rs` can link against the crate.
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
vodozemac = { version = "=0.11.0", default-features = false }
chacha20poly1305 = { version = "=0.11.0", features = ["zeroize"] }
aead-stream = { version = "=0.6.0", features = ["alloc"] }
argon2 = { version = "=0.6.0", features = ["zeroize"] }
sha2 = "0.11"
zeroize = { version = "1.9", features = ["zeroize_derive"] }
getrandom = { version = "0.4", features = ["sys_rng"] }
subtle = "2.6"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

# Argon2id at 64 MiB is ~15x slower unoptimised; keep `cargo test` and debug app
# unlocks usable without touching the crate's own profile.
[profile.dev.package.argon2]
opt-level = 3

[profile.release]
panic = "unwind"
opt-level = 3
lto = "thin"
strip = true
codegen-units = 1
