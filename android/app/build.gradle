plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}



def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

// Release signing comes only from the build service's environment: Codemagic sets these four
// from its `android_signing` keystore, the GitHub release-tag job from repository secrets. There is
// no file fallback and no throwaway key: a release build without them stops (see the check at the
// end of this file). Debug builds keep the machine's own debug key.
def releaseSigningVariables = [
    "ANDROID_KEYSTORE_PATH",
    "ANDROID_KEYSTORE_ALIAS",
    "ANDROID_KEYSTORE_PASSWORD",
    "ANDROID_KEYSTORE_PRIVATE_KEY_PASSWORD",
]
def missingReleaseSigning = releaseSigningVariables.findAll { !System.getenv(it) }
// A CI compile proof that is never distributed may build an *unsigned* release APK instead, which no
// device installs. Only an explicit opt-in allows it.
def unsignedReleaseProof = System.getenv("FUZZZY_UNSIGNED_RELEASE_PROOF") == "true"

// "Lock from other apps" (experimental, documents/fuzz_anywhere/CHANNEL.md): the native pieces read the
// same build flag as the Dart side, FUZZ_ANYWHERE=true among the --dart-define values (Flutter hands
// them to Gradle base64-encoded). Without it the app keeps its own engine and every entry point stays off.
def dartDefines = (project.findProperty("dart-defines") ?: "").toString().split(",").findAll { it }.collect {
    new String(it.decodeBase64(), "UTF-8")
}
def fuzzAnywhereBuild = dartDefines.contains("FUZZ_ANYWHERE=true")

android {
    namespace "com.fuzzzycore.ink"
    compileSdk 36
    ndkVersion flutter.ndkVersion

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
        test.java.srcDirs += 'src/test/kotlin'
    }

    defaultConfig {
        applicationId "com.fuzzzycore.ink"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        resValue "bool", "fuzz_anywhere_build", fuzzAnywhereBuild.toString()
    }

    // The native sheet of "Lock from other apps" is Jetpack Compose (Material 3). Its activity and tile
    // are declared in the development flavour only (src/development/AndroidManifest.xml); elsewhere
    // nothing references the code and the release shrinker drops it.
    buildFeatures {
        compose true
    }

    composeOptions {
        // The Compose compiler that matches Kotlin 1.9.22 (settings.gradle).
        kotlinCompilerExtensionVersion "1.5.10"
    }

    signingConfigs {
        if (missingReleaseSigning.isEmpty()) {
            release {
                storeFile file(System.getenv("ANDROID_KEYSTORE_PATH"))
                keyAlias System.getenv("ANDROID_KEYSTORE_ALIAS")
                keyPassword System.getenv("ANDROID_KEYSTORE_PRIVATE_KEY_PASSWORD")
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
            }
        }
    }

    flavorDimensions "default"
    productFlavors { 
        production {
            dimension "default"
            applicationIdSuffix ""
            manifestPlaceholders = [appName: "Fuzzzy Ink"]
        }
        staging {
            dimension "default"
            applicationIdSuffix ".stg"
            manifestPlaceholders = [appName: "[STG] Fuzzzy Ink"]
        }
        development {
            dimension "default"
            applicationIdSuffix ".dev"
            manifestPlaceholders = [appName: "[DEV] Fuzzzy Ink"]
        }
    }

    buildTypes {
        release {
            // null only for the unsigned compile proof; any other release build without the key stops below.
            signingConfig missingReleaseSigning.isEmpty() ? signingConfigs.release : null
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt')
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }
}

flutter {
    source '../..'
}

// Fails a release build that has no release key, naming what is missing, before anything is built.
// Also fails a staging or production build that carries "Lock from other apps" (FUZZ_ANYWHERE=true):
// the experiment is for the development flavour only (security review 2026-10-26).
gradle.taskGraph.whenReady { graph ->
    def experimentTasks = graph.allTasks.findAll {
        it.project == project && it.name ==~ /(assemble|bundle|package)(Staging|Production)\w*/
    }
    if (fuzzAnywhereBuild && !experimentTasks.isEmpty()) {
        throw new GradleException(
            "FUZZ_ANYWHERE=true is for the development flavour only: \"Lock from other apps\" is an " +
            "experiment (documents/fuzz_anywhere/CHANNEL.md). Build staging and production without it."
        )
    }
    def releaseTasks = graph.allTasks.findAll {
        it.project == project && it.name ==~ /(assemble|bundle|package)\w*Release/
    }
    if (!releaseTasks.isEmpty() && !missingReleaseSigning.isEmpty() && !unsignedReleaseProof) {
        throw new GradleException(
            "Release signing is not set up: ${missingReleaseSigning.join(', ')} " +
            "${missingReleaseSigning.size() == 1 ? 'is' : 'are'} missing.\n" +
            "A release build is signed only with the real key, which the build service provides " +
            "(Codemagic: the workflow's android_signing keystore; GitHub: the release-tag secrets, " +
            "documents/security/RELEASE.md). Debug builds need no key. A compile proof that is never " +
            "distributed may set FUZZZY_UNSIGNED_RELEASE_PROOF=true to build an unsigned APK."
        )
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.3'
    // FileProvider for the content URIs UserFiles.kt hands out (T-0366).
    implementation 'androidx.core:core:1.13.1'

    // "Lock from other apps": the Material 3 sheet. Exact versions: the Compose BOM pins every Compose
    // artifact (2024.12.01: Compose 1.7.6, Material 3 1.3.1); listed in documents/security/sbom/android.cdx.json (`./sbom.sh android`).
    implementation platform('androidx.compose:compose-bom:2024.12.01')
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.7.3'
}
