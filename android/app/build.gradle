plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}



def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

// Release signing comes only from the build service's environment: Codemagic sets these four
// from its `android_signing` keystore, the GitHub release-tag job from repository secrets. There is
// no file fallback and no throwaway key: a release build without them stops (see the check at the
// end of this file). Debug builds keep the machine's own debug key.
def releaseSigningVariables = [
    "ANDROID_KEYSTORE_PATH",
    "ANDROID_KEYSTORE_ALIAS",
    "ANDROID_KEYSTORE_PASSWORD",
    "ANDROID_KEYSTORE_PRIVATE_KEY_PASSWORD",
]
def missingReleaseSigning = releaseSigningVariables.findAll { !System.getenv(it) }
// A CI compile proof that is never distributed may build an *unsigned* release APK instead, which no
// device installs. Only an explicit opt-in allows it.
def unsignedReleaseProof = System.getenv("FUZZZY_UNSIGNED_RELEASE_PROOF") == "true"

android {
    namespace "com.fuzzzycore.ink"
    compileSdk 36
    ndkVersion flutter.ndkVersion

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.fuzzzycore.ink"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
        if (missingReleaseSigning.isEmpty()) {
            release {
                storeFile file(System.getenv("ANDROID_KEYSTORE_PATH"))
                keyAlias System.getenv("ANDROID_KEYSTORE_ALIAS")
                keyPassword System.getenv("ANDROID_KEYSTORE_PRIVATE_KEY_PASSWORD")
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
            }
        }
    }

    flavorDimensions "default"
    productFlavors { 
        production {
            dimension "default"
            applicationIdSuffix ""
            manifestPlaceholders = [appName: "Fuzzzy Ink"]
        }
        staging {
            dimension "default"
            applicationIdSuffix ".stg"
            manifestPlaceholders = [appName: "[STG] Fuzzzy Ink"]
        }
        development {
            dimension "default"
            applicationIdSuffix ".dev"
            manifestPlaceholders = [appName: "[DEV] Fuzzzy Ink"]
        }
    }

    buildTypes {
        release {
            // null only for the unsigned compile proof; any other release build without the key stops below.
            signingConfig missingReleaseSigning.isEmpty() ? signingConfigs.release : null
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt')
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }
}

flutter {
    source '../..'
}

// Fails a release build that has no release key, naming what is missing, before anything is built.
gradle.taskGraph.whenReady { graph ->
    def releaseTasks = graph.allTasks.findAll {
        it.project == project && it.name ==~ /(assemble|bundle|package)\w*Release/
    }
    if (!releaseTasks.isEmpty() && !missingReleaseSigning.isEmpty() && !unsignedReleaseProof) {
        throw new GradleException(
            "Release signing is not set up: ${missingReleaseSigning.join(', ')} " +
            "${missingReleaseSigning.size() == 1 ? 'is' : 'are'} missing.\n" +
            "A release build is signed only with the real key, which the build service provides " +
            "(Codemagic: the workflow's android_signing keystore; GitHub: the release-tag secrets, " +
            "documents/security/RELEASE.md). Debug builds need no key. A compile proof that is never " +
            "distributed may set FUZZZY_UNSIGNED_RELEASE_PROOF=true to build an unsigned APK."
        )
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.3'
    // FileProvider for the content URIs UserFiles.kt hands out (T-0366).
    implementation 'androidx.core:core:1.13.1'
}
