# A brick that generates a new feature with local storage.
name: local_brick
description: Creates a new feature with a BLoC, Repository, and Isar local storage setup.
version: 0.1.0+1

environment:
  mason: 0.1.1

vars:
  parentFeatureName:
    type: string
    description: Parent folder name in which the feature is created (e.g., 'fuzzzy_ink')
    default: fuzzzy_ink
    prompt: What is the name of your parent folder?
  name:
    type: string
    description: Name of the feature/service (e.g., 'UserSettings')
    default: UserSettings
    prompt: What is the name of your feature/service?
  modelName:
    type: string
    description: Model name that you want to manage (e.g., 'UserPreferences')
    default: UserPreferences
    prompt: What is the name of the model?
  functionName:
    type: string
    description: Function name that calls the repository to get data (e.g., 'fetchPreferences')
    default: fetchPreferences
    prompt: What is the name of the function that fetches the data?
