name: fuzzzy_ink
description: End to End encripted chat, It's content is stored locally only and can be read only by chat members
version: 1.1.1+3
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  app_links: ^7.0.0
  biometric_storage: ^5.0.1
  bloc: ^8.1.2
  desktop_drop: ^0.6.0
  file_picker: ^8.0.5
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.3
  flutter_dropzone: ^4.0.0
  flutter_localizations:
    sdk: flutter
  flutter_rust_bridge: 2.13.0
  flutter_secure_storage: ^9.2.2
  fuzzy_crypto_core:
    path: rust_builder
  fuzzzy_ui_kit:
    git:
      url: https://github.com/fuzzzy-bot/fuzzy_design.git
      ref: f6f08b2b6616ff0669f8e17e5c67a9ebcc7522b1 # CP47 — Ink Night lifted (T-0361)
  get_it: ^8.0.0
  go_router: ^13.0.1
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  logger: ^2.4.0
  marionette_flutter: ^0.6.0
  path: ^1.9.0
  path_provider: ^2.0.11
  permission_handler: ^12.0.0
  share_plus: ^10.1.2
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.1
  uuid: ^4.5.1
  vibration: ^2.0.1

dev_dependencies:
  bloc_test: ^9.1.4
  flutter_launcher_icons: ^0.13.1
  flutter_test:
    sdk: flutter
  marionette_mcp: ^0.6.0
  mocktail: ^1.0.0
  very_good_analysis: ^5.1.0

flutter:
  uses-material-design: true
  generate: true

